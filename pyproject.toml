[project]
name = "agent-edit"
version = "0.1.0"
description = "A coding agent adapts a frozen vision model to new classes from a few labeled images by editing its class head with code, without gradients."
keywords = ["few-shot", "instance segmentation", "coding agent", "weight editing"]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "pycocotools>=2.0.8",
    "scipy>=1.11",
    "torch>=2.4",
    "pyyaml>=6",
]

[project.urls]
Repository = "https://github.com/Khayrulbuet13/agent-edit"

[project.optional-dependencies]
# Pinned to the versions the reported runs used.
pmt = [
    "torch==2.9.0",
    "torchvision==0.24.0",
    "transformers==4.56.1",
    "numpy>=2.1",
    "timm>=1.0.20",
    "safetensors>=0.4",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
"agent-edit" = "agent_edit.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_edit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs real caches, runs and data (AGENT_EDIT_* set); not run in CI",
    "gpu: needs a CUDA GPU",
]

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["src", "tests"]
# examples/ holds code an agent wrote; it ships as the agent left it.
extend-exclude = ["examples", "prompts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["E731", "B905", "B023"]

[tool.ruff.lint.per-file-ignores]
"src/agent_edit/backends/*/backend.py" = ["E501"]
